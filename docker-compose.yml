# Optional services. The project runs without Docker: Qdrant has an embedded local mode
# (CREATOROPS_QDRANT_MODE=local, the default) and Ollama runs natively.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant_server:/qdrant/storage
    restart: unless-stopped
